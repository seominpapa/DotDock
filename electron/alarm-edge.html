<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>DotDock 알림 효과</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
body::after { content:''; position:fixed; inset:0; border:5px solid #a5b4fc;
  border-radius:14px; box-shadow:inset 0 0 30px 8px #818cf899;
  animation:glow 3s ease-in-out both; }
@keyframes glow { 0%,100% { opacity:0; } 25%,70% { opacity:.8; } }
@media(prefers-reduced-motion:reduce) { body::after { animation:none; opacity:.5; } }
</style></head><body aria-hidden="true"></body></html>
