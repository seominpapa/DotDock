name: Build and verify desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: windows-2022
            platform: win
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      DOTDOCK_SMOKE_ALLOW_NO_WEBGL: ${{ matrix.runner == 'macos-15-intel' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check release version and native architecture
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if(process.arch!==process.env.EXPECTED_ARCH) throw Error(`Expected ${process.env.EXPECTED_ARCH}, got ${process.arch}`); if(process.env.GITHUB_REF_TYPE==="tag" && process.env.GITHUB_REF_NAME!==`v${p.version}`) throw Error("Tag must match package version");'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - run: npm run typecheck
      - run: npm test
      - name: Verify Antigravity authentication with bundled Electron SQLite
        shell: bash
        run: |
          node -e 'const {spawnSync}=require("node:child_process"); const result=spawnSync(require("electron"),["--test","tests/antigravity-auth.test.cjs"],{stdio:"inherit",env:{...process.env,ELECTRON_RUN_AS_NODE:"1"}}); if(result.error) throw result.error; process.exit(result.status ?? 1);'
      - name: Verify pinned model manifest
        shell: bash
        run: |
          python_command=python3
          if [[ "$RUNNER_OS" == 'Windows' ]]; then python_command=python; fi
          "$python_command" scripts/package-3d-models.py --check
      - run: npm run build:web
      - name: Verify source app on native OS
        run: node scripts/smoke-electron.cjs
        env:
          DOTDOCK_SMOKE_OUTPUT: test-results/source
      - name: Package installers
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install DMG into temporary directory and verify app
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          dmg=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/dotdock-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          ditto "$mount/DotDock.app" "$RUNNER_TEMP/DotDock.app"
          hdiutil detach "$mount"
          DOTDOCK_EXECUTABLE="$RUNNER_TEMP/DotDock.app/Contents/MacOS/DotDock" DOTDOCK_SMOKE_OUTPUT=test-results/installed node scripts/smoke-electron.cjs
      - name: Install Windows EXE silently and verify installed app
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/DotDock-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'DotDockInstalled'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:DOTDOCK_EXECUTABLE = Join-Path $installDir 'DotDock.exe'
          $env:DOTDOCK_SMOKE_OUTPUT = 'test-results/installed'
          node scripts/smoke-electron.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: warn
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*-win.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Package standalone 3D models
        run: |
          python3 scripts/package-3d-models.py --check
          python3 scripts/package-3d-models.py --output-directory installers
      - name: Publish verified release with SHA-256 checksums
        shell: bash
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          installers=( *.dmg *.exe *.zip )
          test "${#installers[@]}" -gt 0
          sha256sum -- "${installers[@]}" > SHA256SUMS.txt
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != 'true' ]]; then
              echo 'Refusing to overwrite an already published release.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "DotDock $RELEASE_TAG" --notes $'0.1.8: Windows에서 Antigravity 인증 DB를 읽을 때 별도 sqlite3가 없어 오래되거나 삭제된 토큰을 감지하던 문제를 수정했습니다. 앱에 포함된 SQLite로 현재 DB와 WAL을 읽기 전용으로 조회하며, Antigravity 로그인 후 로컬 인증 감지를 사용하도록 안내합니다. 실제 개인 계정 인증 성공은 별도 확인이 필요합니다.\n\nDOT 12종은 굵은 윤곽선과 제한된 색상의 독립된 32×32 도트 도안을 사용합니다. SVG 도형으로 표시해 1.5배에서도 선명하며, 3D 선택 목록은 실제 GLB에서 만든 정지 미리보기로 표시합니다. 3D 선택 시 해당 모델을 GitHub에서 자동 다운로드하고 검증한 뒤 캐시에 저장하며, 별도 12종 모델 ZIP도 제공합니다. 생일을 입력하면 만 나이 × 0.8을 반올림해 괄호 안에 표시하며, 생일이 없으면 나이는 생략합니다.\n\nSVG·도트·Tripo 3D 12지신을 선택할 수 있습니다. 3D는 드래그 회전과 사용자 GLB 가져오기를 지원하며, 화면 변화가 없을 때 렌더링을 멈춥니다.\n생일을 입력하면 96년생 쥐띠(24세)처럼 만 나이 × 0.8을 반올림한 기분 나이를 표시합니다. 공식 나이가 아닌 농담입니다.\n여러 AI 사용량을 동시에 표시하며 설정의 업데이트 확인 또는 시작 시 알림으로 새 버전을 받을 수 있습니다.\n\nmacOS: DMG를 열고 DotDock을 Applications로 복사하세요.\nWindows: DotDock-Setup 설치 EXE를 실행하세요.\n비서명 앱 보안 경고 해제 방법은 README를 확인하세요.\n\nmacOS Apple Silicon·Intel 및 Windows Server 2022 CI에서 소스와 설치된 앱의 기본 기능·저장 복원을 자동 검증했습니다. Apple Silicon·Windows에서는 12종 3D를, WebGL을 제공하지 않는 Intel 맥 CI에서는 2D 복원을 검사합니다. 실제 Intel 맥의 3D 렌더링은 미검증입니다. 실제 계정 OAuth, 개인 Windows 10/11 PC와 다양한 물리 GPU 성능은 검증하지 않았습니다.'
          fi
          gh release upload "$RELEASE_TAG" "${installers[@]}" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
