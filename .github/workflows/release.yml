name: Build and verify desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build Windows only when macOS is signed locally
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && inputs.windows_only
            && '[{"runner":"windows-2022","platform":"win","arch":"x64"}]'
            || '[{"runner":"macos-15","platform":"mac","arch":"arm64"},{"runner":"macos-15-intel","platform":"mac","arch":"x64"},{"runner":"windows-2022","platform":"win","arch":"x64"}]'
          ) }}
    runs-on: ${{ matrix.runner }}
    env:
      DOTDOCK_SMOKE_ALLOW_NO_WEBGL: ${{ matrix.runner == 'macos-15-intel' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require Apple release credentials
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Apple release credential: $name" >&2
              exit 1
            fi
          done
      - name: Install locked dependencies
        run: npm ci
      - name: Check release version and native architecture
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if(process.arch!==process.env.EXPECTED_ARCH) throw Error(`Expected ${process.env.EXPECTED_ARCH}, got ${process.arch}`); if(process.env.GITHUB_REF_TYPE==="tag" && process.env.GITHUB_REF_NAME!==`v${p.version}`) throw Error("Tag must match package version");'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - run: npm run typecheck
      - run: npm test
      - name: Verify Antigravity connection with bundled Electron runtime
        shell: bash
        run: |
          node -e 'const {spawnSync}=require("node:child_process"); const result=spawnSync(require("electron"),["--test",...require("node:fs").readdirSync("tests").filter(f=>/^antigravity-.*\.test\.cjs$/.test(f)).map(f=>`tests/${f}`)],{stdio:"inherit",env:{...process.env,ELECTRON_RUN_AS_NODE:"1"}}); if(result.error) throw result.error; process.exit(result.status ?? 1);'
      - name: Verify pinned model manifest
        shell: bash
        run: |
          python_command=python3
          if [[ "$RUNNER_OS" == 'Windows' ]]; then python_command=python; fi
          "$python_command" scripts/package-3d-models.py --check
      - run: npm run build:web
      - name: Verify source app on native OS
        run: node scripts/smoke-electron.cjs
        env:
          DOTDOCK_SMOKE_OUTPUT: test-results/source
      - name: Package signed and notarized macOS installers
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package Windows installers
        if: matrix.platform == 'win'
        run: npx electron-builder --win --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install DMG into temporary directory and verify app
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/dotdock-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          ditto "$mount/DotDock.app" "$RUNNER_TEMP/DotDock.app"
          hdiutil detach "$mount"
          node scripts/verify-mac-signing.cjs "$RUNNER_TEMP/DotDock.app"
          DOTDOCK_EXECUTABLE="$RUNNER_TEMP/DotDock.app/Contents/MacOS/DotDock" DOTDOCK_SMOKE_OUTPUT=test-results/installed node scripts/smoke-electron.cjs
      - name: Install Windows EXE silently and verify installed app
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/DotDock-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'DotDockInstalled'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:DOTDOCK_EXECUTABLE = Join-Path $installDir 'DotDock.exe'
          $env:DOTDOCK_SMOKE_OUTPUT = 'test-results/installed'
          node scripts/smoke-electron.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: warn
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            release/*-win.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.windows_only)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Package standalone 3D models
        run: |
          python3 scripts/package-3d-models.py --check
          python3 scripts/package-3d-models.py --output-directory installers
      - name: Publish verified release with SHA-256 checksums
        shell: bash
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          installers=( *.dmg *.exe *.zip )
          test "${#installers[@]}" -gt 0
          sha256sum -- "${installers[@]}" > SHA256SUMS.txt
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != 'true' ]]; then
              echo 'Refusing to overwrite an already published release.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "DotDock $RELEASE_TAG" --notes $'macOS 앱을 Developer ID Application 인증서로 서명하고 Apple 공증과 Gatekeeper 검증을 통과한 뒤 배포합니다. DMG에서 꺼낸 앱도 서명·공증 티켓과 실행을 검증합니다.\n\nWindows 설치 파일에는 Apple 인증서가 적용되지 않으며 SmartScreen 안내는 README에 유지합니다. 기존 캐릭터·AI 사용량·일정·절전 복귀 동기화 기능은 유지합니다.\n\nmacOS는 CPU에 맞는 DMG를 열어 DotDock을 Applications로 복사하고, Windows는 Setup EXE를 실행하세요. 설정과 메모는 사용자 데이터 폴더에 유지됩니다.\n\n개인 계정 OAuth, 실제 Intel 맥의 3D 및 다양한 물리 GPU 환경은 별도 확인이 필요합니다.'
          fi
          gh release upload "$RELEASE_TAG" "${installers[@]}" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
